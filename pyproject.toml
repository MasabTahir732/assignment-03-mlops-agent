[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "assignment-03-mlops-agent"
version = "1.0.0"
description = "Evidence-based MLOps assistant with a tiny Iris dataset"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi==0.121.3", "uvicorn==0.38.0", "pydantic==2.12.4",
  "requests==2.32.5", "PyYAML==6.0.3", "numpy==2.3.5",
  "pandas==2.3.3", "scikit-learn==1.8.0", "joblib==1.5.2",
  "mlflow==3.6.0", "dvc==3.65.0", "python-dotenv==1.2.4",
  "pathspec==0.12.1", "SQLAlchemy==2.0.44",
]

[project.optional-dependencies]
dev = ["pytest==9.0.1", "ruff==0.14.6", "httpx==0.28.1"]

[project.scripts]
mlops-agent = "agent.main:main"

[tool.setuptools.packages.find]
include = ["agent*", "api*", "training*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
